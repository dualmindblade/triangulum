[package]
name = "triangulum"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Triangulum engine: a planet-sized cube-sphere voxel world (M1a skeleton)"

# Standalone crate: not a member of the viewer workspace.
[workspace]

[dependencies]
wgpu = "30.0.0"
winit = "0.30.13"
glam = "0.33.2"
rayon = "1.12.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
png = "0.18.1"
pollster = "0.4.0"
# egui-wgpu 0.35 pins wgpu 29, so the overlay paints through our own small
# painter (ui.rs), as the old viewer does. egui-winit only needs winit.
egui = "0.35.0"
egui-winit = { version = "0.35.0", default-features = false, features = ["links"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 1
